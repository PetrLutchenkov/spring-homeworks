spring:
  application:
    name: task-manager
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:taskdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
app:
  task:
    cleanup:
      cron: "0 0 3 * * *"